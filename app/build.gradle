plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mmcponsel.app'
    compileSdk 35
    defaultConfig {
        manifestPlaceholders = [facebookAppId: (project.findProperty('FACEBOOK_APP_ID') ?: 'YOUR_FACEBOOK_APP_ID')]
        applicationId 'com.mmcponsel.app'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '3.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

apply plugin: 'com.google.gms.google-services'

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    implementation 'com.facebook.android:facebook-login:19.0.0'
}
